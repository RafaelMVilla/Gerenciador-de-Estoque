<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockUp</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body>
    <div>
        <h1>StockUp - Gerenciador de Estoque!</h1>
    </div>
    <div>
        <h2>Lista de Itens</h2>
        <button id="btn-itens">Listar Itens</button>
        <table id="item-table" border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Dispositivo</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Responsável</th>
                    <th>Local</th>
                </tr>
            </thead>
            <tbody id="item-tbody"></tbody>
        </table>
    </div>

    <div>
        <h2>Adicionar Itens</h2>
        <form action="" method="get" id="form-item-add">

            <input type="text" id="input-item-dispositivo" placeholder="Digite o nome do dispositivo" required>

            <input type="text" id="input-item-marca" placeholder="Digite a marca do dispositivo" required>

            <input type="text" id="input-item-modelo" placeholder="Digite o modelo do dispositivo" required>

            <input type="text" id="input-item-responsavel" placeholder="Digite o responsável do dispositivo" required>

            <input type="text" id="input-item-local" placeholder="Digite o local do dispositivo" required>

            <button type="submit">Adicionar item</button>
        </form>
    </div>
    <div>
        <form action="" method="get" id="form-item-busca">
            <h2>Buscar Item</h2>
            <input type="number" id="input-item-busca" placeholder="Digite o ID do item" required>
            <button type="submit">Buscar</button>
        </form>
    </div>
    <div>
        <form action="" method="get" id="form-item-alterar">
            <h2>Alterar Item</h2>
            <input type="number" id="input-item-id-alterado" placeholder="Digite o ID do item" required>

            <input type="text" id="input-item-dispositivo-alterado" placeholder="Digite o novo nome do dispositivo" required>

            <input type="text" id="input-item-marca-alterado" placeholder="Digite a nova marca do dispositivo" required>

            <input type="text" id="input-item-modelo-alterado" placeholder="Digite o novo modelo do dispositivo" required>

            <input type="text" id="input-item-responsavel-alterado" placeholder="Digite o novo responsável do dispositivo" required>

            <input type="text" id="input-item-local-alterado" placeholder="Digite o novo local do dispositivo" required>

            <button type="submit">Alterar item</button>
        </form>
    </div>
    <div>
        <form action="" method="get" id="form-delete">
            <h2>Deletar Item</h2>
            <input type="number" id="input-item-delete" placeholder="Digite o ID do Item">
            <button type="submit">Deletar</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
