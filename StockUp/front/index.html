<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockUp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <h1>StockUp - Gerenciador de Estoque!</h1>
    </div>
    <div>
        <h2>Lista de Itens</h2>
        <button id="btn-itens">Listar Itens</button>
        <ul id="item-list"></ul>
    </div>

    <div>
        <h2>Adicionar Itens</h2>
        <form action="" method="get" id="form-item-add">
            <h3>Adicionar novo Item</h3>

            <input type="text" id="input-item-dispositivo" placeholder="Digite o nome do dispositivo" required>

            <input type="text" id="input-item-marca" placeholder="Digite a marca do dispositivo" required>

            <input type="text" id="input-item-modelo" placeholder="Digite o modelo do dispositivo" required>

            <input type="text" id="input-item-responsavel" placeholder="Digite o responsável do dispositivo" required>

            <input type="text" id="input-item-local" placeholder="Digite o local do dispositivo" required>

            <button type="submit">Adicionar item</button>
        </form>
    </div>
    <div>
        <form action="" method="get" id="form-item-busca">
            <h2>Buscar Item</h2>
            <input type="number" id="input-item-busca" placeholder="Digite o ID do item" required>
            <button type="submit">Buscar</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
